name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 防止并发流水线互相踩踏
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc strict + noUnusedLocals)
        run: pnpm typecheck

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Build (next build)
        # 清空 NODE_OPTIONS，避免继承 --use-system-ca 导致 Turbopack worker 拒绝
        env:
          NODE_OPTIONS: ""
        run: pnpm build
